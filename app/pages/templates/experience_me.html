<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#244d40">
  <title>내 경험 모아보기 · 자소서담</title><meta name="description" content="나의 경험과 발견한 강점을 한곳에서 확인하세요.">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/css/styles.css"><link rel="stylesheet" href="/static/css/experience.css"><script src="/static/js/experience.js" defer></script>
</head>
<body class="experience-page" data-view="list">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header"><div class="header-inner"><a class="brand" href="/" aria-label="자소서담 홈"><span class="brand-icon" aria-hidden="true">담<i></i></span><span>자소서담<small>CAREER AGENT</small></span></a><nav class="experience-nav" aria-label="주 메뉴"><a href="/experience/create" data-nav="create">경험 정리</a><a href="/experience/me" data-nav="list">내 경험 모아보기</a></nav><a class="text-link session-link" id="session-link" href="/login">로그인</a></div></header>
  <main id="main" class="experience-main section-wrap">
    <div class="workspace-heading"><div><p class="eyebrow"><span class="status-dot"></span> MY EXPERIENCE COLLECTION</p><h1>내가 쌓아온 경험, 나만의 가능성.</h1><p>하나씩 모은 이야기가 나를 더 잘 설명해 줄 거예요.</p></div><a class="button" href="/experience/create">새 경험 정리하기 <span aria-hidden="true">＋</span></a></div>
    <div id="session-notice" class="notice" role="status"><span id="session-text">로그인 상태를 확인하고 있어요.</span><a id="session-login" href="/login" hidden>로그인하기 ↗</a><button id="session-retry" class="link-button" type="button" hidden>다시 확인</button></div>
    <div id="page-error" class="error-notice" role="alert" tabindex="-1" hidden><p id="page-error-text"></p><button class="link-button" id="page-retry" type="button" hidden>다시 불러오기 ↻</button></div>
    <section id="collection" hidden aria-label="나의 경험 목록"><div class="collection-toolbar"><div class="collection-filters" role="group" aria-label="정리 상태 필터"><button class="filter-button" data-filter="all" aria-pressed="true" type="button">전체 경험</button><button class="filter-button" data-filter="completed" aria-pressed="false" type="button">정리 완료</button><button class="filter-button" data-filter="processing" aria-pressed="false" type="button">정리 중</button></div><input class="search-field" id="experience-search" type="search" placeholder="경험 제목이나 역량 검색" aria-label="경험 제목이나 역량 검색"></div><p id="collection-count" class="collection-count" role="status"></p><div id="experience-list" class="collection-grid"></div><div id="empty-state" class="empty-state" hidden><span aria-hidden="true">✧</span><h2 id="empty-title">첫 경험을 담아 볼까요?</h2><p id="empty-description">대단한 성과가 아니어도 좋아요. 기억나는 순간부터 시작해 보세요.</p><a id="empty-create" class="button" href="/experience/create">첫 경험 정리하기 <span aria-hidden="true">↗</span></a></div></section>
    <p id="collection-loading" class="collection-loading" role="status" hidden>나의 경험을 불러오고 있어요…</p>
    <p id="toast" class="experience-toast" role="status" hidden></p>
    <noscript><p class="error-notice">내 경험을 확인하려면 JavaScript를 활성화해 주세요.</p></noscript>
  </main><footer class="experience-footer section-wrap"><span class="footer-brand">자소서담</span><p>경험을 담아, 나답게.</p><small>© <span data-year>2026</span> Career Agent</small></footer>
</body></html>
